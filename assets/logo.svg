<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#115e59;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="250" cy="250" r="240" fill="url(#grad1)" stroke="#f59e0b" stroke-width="15"/>
  
  <!-- Inner Ring -->
  <circle cx="250" cy="250" r="180" fill="none" stroke="white" stroke-width="2" stroke-dasharray="10,10"/>
  
  <!-- Central Geometry (Abstract Engineering/Mining Symbol) -->
  <path d="M250 100 L380 175 L380 325 L250 400 L120 325 L120 175 Z" fill="none" stroke="#f59e0b" stroke-width="10" />
  <path d="M250 130 L350 190 L350 310 L250 370 L150 310 L150 190 Z" fill="#ffffff" opacity="0.1" />
  
  <!-- Cross/Structure Lines -->
  <line x1="250" y1="100" x2="250" y2="400" stroke="#f59e0b" stroke-width="4" />
  <line x1="120" y1="250" x2="380" y2="250" stroke="#f59e0b" stroke-width="4" />

  <!-- Text -->
  <text x="250" y="80" font-family="Arial, sans-serif" font-weight="bold" font-size="45" text-anchor="middle" fill="white" letter-spacing="4">MBSC</text>
  <text x="250" y="460" font-family="Arial, sans-serif" font-weight="bold" font-size="35" text-anchor="middle" fill="#f59e0b" letter-spacing="4">AUSTRALIA</text>
  
  <!-- Est text -->
  <text x="250" y="265" font-family="Arial, sans-serif" font-weight="bold" font-size="80" text-anchor="middle" fill="white" opacity="0.9">M</text>
