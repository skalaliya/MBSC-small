# Rebuilds production every Monday at 02:00 Melbourne time so the training calendar's
# default year and "upcoming" list never go stale. Requires a Vercel Deploy Hook URL
# saved as the repository secret VERCEL_DEPLOY_HOOK_URL
# (Vercel > Project > Settings > Git > Deploy Hooks, branch: main).
name: Weekly rebuild

on:
  schedule:
    - cron: '0 16 * * 0' # 16:00 UTC Sunday = 02:00 AEST Monday (03:00 during daylight saving)
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call Vercel deploy hook
        run: |
          if [ -z "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL secret is not set; skipping." && exit 0
          fi
          curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
