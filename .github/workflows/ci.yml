name: CI

on:
  push:
    branches: [main, integration]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Australia/Melbourne
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - name: Unit tests in UTC
        run: TZ=UTC npm test
      - run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
      - name: Lighthouse budgets
        # Accessibility, SEO, best practices and layout shift fail the build; performance warns,
        # so network noise on shared runners can't block a release.
        run: npx --yes @lhci/cli@0.15 autorun
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
